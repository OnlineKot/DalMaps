name: Deploy na GitHub Pages

# Publikacja przez gałąź gh-pages (GitHub włącza Pages automatycznie po jej
# utworzeniu) — token workflow nie ma prawa włączyć Pages przez API,
# więc wariant z actions/deploy-pages odpadł.
on:
  push:
    branches: [main, master, claude/dalmahoy-navigator-pwa-wd0qyo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wypchnij zawartość na gh-pages
        run: git push origin HEAD:gh-pages --force
