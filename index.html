<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DalMaps">
<title>DalMaps — Dalmahoy nawigator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#10141c; --panel:#1a2029; --panel2:#232b37; --line:#37414f;
    --txt:#e8edf4; --muted:#98a4b3; --accent:#e53935; --ok:#43a047;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem .4rem}
  header h1{font-size:1.05rem;margin:0;letter-spacing:.02em}
  header .sub{font-size:.7rem;color:var(--muted)}
  #wakebadge{margin-left:auto;font-size:.62rem;color:var(--muted);text-align:right;max-width:9rem}

  .tabs{display:flex;gap:.4rem;padding:.3rem .9rem .5rem}
  .tabs button{flex:1;padding:.5rem 0;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--muted);font-size:.85rem}
  .tabs button.on{background:var(--panel2);color:var(--txt);border-color:#5a6a7e}

  #mapwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 .5rem}
  svg{width:100%;max-width:480px;height:auto;display:block;transition:transform .3s ease-out}
  svg .wall{fill:none;stroke:#6b7686;stroke-width:1}
  svg .zone{fill:#2c3440;stroke:#55606e;stroke-width:.4}
  svg .zone.wing{fill-opacity:.18;stroke-width:.6}
  svg .zone.mark{stroke:var(--accent);stroke-width:.9;fill-opacity:.4}
  svg .zlabel{font-size:3.1px;fill:#cfd8e3;font-weight:600}
  svg .rlabel{font-size:2.5px;fill:#8d99a8}
  svg .route path{fill:none;stroke:transparent;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  svg .route path.on{stroke:var(--accent);stroke-dasharray:3 2.2;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-5.2}}
  svg .walker{fill:#fff;stroke:var(--accent);stroke-width:.9;display:none}
  svg .stairs{fill:#38445466;stroke:#6b7686;stroke-width:.5}

  #panel{background:var(--panel);border-top:1px solid var(--line);
    padding:.6rem .9rem .8rem;display:flex;flex-direction:column;gap:.55rem}
  .row{display:flex;gap:.5rem;align-items:center}
  select,input[type=number]{flex:1;padding:.55rem .5rem;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:.9rem;min-width:0}
  .btn{padding:.55rem .8rem;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:.9rem}
  .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn:disabled{opacity:.4}
  #instr{display:flex;align-items:center;gap:.7rem;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
  #instrArrow{font-size:1.9rem;line-height:1;transition:transform .25s;display:inline-block}
  #instrText{font-size:1rem;font-weight:600;line-height:1.3}
  #steptext{font-size:.95rem;line-height:1.35;min-height:2.6em}
  #stepmeta{font-size:.75rem;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}
  #wingrow{display:flex;gap:.4rem;flex-wrap:wrap}
  #surveyrow{display:none;flex-wrap:wrap;gap:.4rem}
  #surveyrow .btn{flex:1 1 30%;font-size:.82rem}
  #surveyrow.on{display:flex}
  #wingrow .btn{flex:1;font-size:.78rem;padding:.45rem .3rem}
  #wingrow .btn.sel{outline:2px solid var(--accent)}
  details{font-size:.8rem;color:var(--muted)}
  details .row{margin-top:.45rem}
  #sensline{font-size:.72rem;color:var(--muted)}
</style>
</head>

<script>
'use strict';
/* ====================== stałe / localStorage ====================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('dalmaps.'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('dalmaps.'+k, JSON.stringify(v)); }catch(e){} }
};
const FLOORS = ['parter','pietro1','pietro2','pietro3'];
const FLOOR_LABEL = {parter:'parter', pietro1:'1. piętro', pietro2:'2. piętro', pietro3:'3. piętro'};

/* Skrzydła 1. piętra. Kolory = kolory na fizycznym planie ppoż. (placeholder
   do skalibrowania). arcS/arcL = krótszy/dłuższy łuk pętli od klatki Z01–Z02
   do wejścia w skrzydło, len w metrach (szacunek). */
/* label/dir = jak to widać, stojąc na 1. piętrze plecami do schodów. */
const WINGS = {
  polnocne:   {label:'Na wprost',      dir:'na wprost',            color:'#1565c0', arcS:{id:'p1_arc_n_s',len:60}, arcL:{id:'p1_arc_n_l',len:72}, cor:{id:'p1_wing_n',len:7}, zones:['Z13','Z14','Z15']},
  wschodnie:  {label:'W prawo',        dir:'w prawo',              color:'#2e7d32', arcS:{id:'p1_arc_e_s',len:27}, arcL:{id:'p1_arc_e_l',len:105}, cor:{id:'p1_wing_e',len:6}, zones:['Z16','Z17']},
  zachodnie:  {label:'W lewo, daleko', dir:'w lewo (do końca)',    color:'#f9a825', arcS:{id:'p1_arc_w_s',len:39}, arcL:{id:'p1_arc_w_l',len:93}, cor:{id:'p1_wing_w',len:6}, zones:['Z18','Z19']},
  poludniowe: {label:'W lewo, blisko', dir:'w lewo (tuż obok)',    color:'#6a1b9a', arcS:{id:'p1_arc_s_s',len:20}, arcL:{id:'p1_arc_s_l',len:112}, cor:{id:'p1_wing_s',len:9}, zones:['Z20','Z21']},
};

/* Krok trasy. overlays = id ścieżek SVG (pierwsza prowadzi kropkę),
   marks = kody stref do podświetlenia, len = metry, rev = kropka idzie
   od końca ścieżki, rtext = opis dla kierunku odwrotnego. */
function S(floor, overlays, marks, text, wingPick=false, len=0, rev=false, rtext=null){
  return {floor, overlays, marks, text, wingPick, len, rev, rtext};
}
function reverseSteps(steps){
  return steps.slice().reverse().map(s => ({...s, rev:!s.rev, text:(s.rtext||s.text), rtext:s.text}));
}

/* POI + ich "nogi" do klatki Z01–Z02 (kroki w kierunku POI → klatka). */

function leg136(){ // kroki: pokój 136 → klatka Z01–Z02
  const w = state.wing && WINGS[state.wing];
  if (!w){
    return [S('pietro1', ['p1_loop_full'],
      ['Z13','Z14','Z15','Z16','Z17','Z18','Z19','Z20','Z21'],
      'Nie wiem, gdzie jest pokój 136. Zaznacz powyżej, w którą stronę '+
      'idzie się do niego od schodów na 1. piętrze — wtedy poprowadzę '+
      'najkrótszą drogą.', true, 110)];
  }
  return [
    S('pietro1', [w.cor.id], w.zones,
      'Wyjdź z pokoju 136 i dojdź bocznym korytarzem do głównego korytarza.',
      false, w.cor.len, true,
      'Skręć w boczny korytarz — pokój 136 jest na jego końcu.'),
    S('pietro1', [w.arcS.id], [],
      `Idź głównym korytarzem w stronę schodów (ok. ${w.arcS.len} m).`,
      false, w.arcS.len, true,
      `Na górze schodów ruszaj ${w.dir} głównym korytarzem (ok. ${w.arcS.len} m).`),
  ];
}
function legsFor(poi){ return poi==='Pokój 136' ? leg136() : (LEGS[poi]||[]); }

const STAIR_PATH = {parter:'p0_stairs', pietro1:'p1_stairs', pietro2:'p2_stairs', pietro3:'p3_stairs'};
function stairStep(fromFloor, toFloor){
  const up = FLOORS.indexOf(toFloor) > FLOORS.indexOf(fromFloor);
  return S(toFloor, [STAIR_PATH[toFloor]], ['Z01','Z02'],
    `${up?'Wejdź':'Zejdź'} schodami na ${FLOOR_LABEL[toFloor]}.`, false, 8);
}
function buildRoute(a, b){
  if (!a || !b || a===b) return [];
  const fa = POIS[a].floor, fb = POIS[b].floor;
  const steps = [...legsFor(a)];
  if (fa !== fb) steps.push(stairStep(fa, fb));
  steps.push(...reverseSteps(legsFor(b)));
  return steps;
}

/* ====================== stan ====================== */
const state = {
  wing: LS.get('wing136', null),
  stepLen: LS.get('stepLen', 0.75),
  rotateMap: LS.get('rotateMap', false),
  autoLearn: LS.get('autoLearn', true),
  route: [], idx: 0, dist: 0, stepsTaken: 0, segSteps: 0,
  floor: 'parter', pedoOn: false,
};

/* ====================== nauka tempa i długości kroku ====================== */
const walklog = {
  session: null,
  sessions: LS.get('sessions', []),
  start(){
    walklog.session = {
      t0: new Date().toISOString(),
      route: `${$('selStart').value} → ${$('selCel').value}`,
      wing: state.wing, cal: compass.offset,
      stepLen0: state.stepLen, learn: [], steps: 0,
    };
  },
  stop(){
    if (!walklog.session) return;
    const s = walklog.session;
    s.t1 = new Date().toISOString();
    s.steps = state.stepsTaken;
    s.stepLen1 = state.stepLen;
    s.cad = pedo.cadence();
    walklog.sessions.push(s);
    if (walklog.sessions.length > 20) walklog.sessions.shift();
    LS.set('sessions', walklog.sessions);
    walklog.session = null;
  },
  /* odcinek o znanej długości przeszedłeś w N kroków → realna długość kroku */
  learn(len, steps){
    if (steps < 8 || len < 8) return;                  // za mała próbka
    const est = Math.min(1.2, Math.max(0.4, len / steps));
    if (walklog.session) walklog.session.learn.push({len, steps, est: +est.toFixed(3)});
    if (state.autoLearn){
      const v = Math.min(1.2, Math.max(0.4, 0.7*state.stepLen + 0.3*est));
      state.stepLen = +v.toFixed(3);
      LS.set('stepLen', state.stepLen);
      const inp = $('inpStep'); if (inp) inp.value = state.stepLen.toFixed(2);
    }
  },
  async export(){
    const data = {
      app: 'DalMaps', ver: 3, exported: new Date().toISOString(),
      stepLen: state.stepLen, autoLearn: state.autoLearn,
      wing: state.wing, compassOffset: compass.offset,
      lastRoute: LS.get('lastRoute', null),
      sessions: walklog.sessions.concat(walklog.session ? [walklog.session] : []),
      surveys: LS.get('surveys', []),
      ua: navigator.userAgent,
    };
    const text = 'Dane marszu DalMaps (wklej w rozmowie z Claude):\n' +
                 JSON.stringify(data, null, 1);
    try {
      if (navigator.share){ await navigator.share({title: 'Dane marszu DalMaps', text}); return 'Udostępniono.'; }
    } catch(e){ /* użytkownik anulował — spróbuj schowka */ }
    try {
      await navigator.clipboard.writeText(text);
      return 'Skopiowano do schowka — wklej w rozmowie z Claude.';
    } catch(e){
      prompt('Skopiuj dane ręcznie:', text);
      return 'Dane pokazane do skopiowania.';
    }
  }
};

/* ====================== geometria tras ====================== */
/* Próbkuje ścieżkę SVG kroku, upraszcza do wierzchołków i wykrywa zakręty.
   Wszystkie kąty w "stopniach mapy": 0 = góra planu, 90 = prawo, zgodnie
   z ruchem wskazówek. */
const geomCache = new Map();
function angleDiff(a, b){ return ((a - b + 540) % 360) - 180; }
function stepGeom(st){
  if (!st.overlays[0]) return null;
  const key = st.overlays[0] + (st.rev ? ':r' : '');
  if (geomCache.has(key)) return geomCache.get(key);
  const path = $(st.overlays[0]);
  if (!path || !path.getTotalLength) return null;
  const L = path.getTotalLength();
  const n = Math.max(2, Math.ceil(L / 0.5));
  let pts = [];
  for (let i = 0; i <= n; i++){
    const p = path.getPointAtLength(L * i / n);
    pts.push({x: p.x, y: p.y});
  }
  if (st.rev) pts.reverse();
  let d = 0; pts[0].d = 0;
  for (let i = 1; i < pts.length; i++){
    d += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    pts[i].d = d;
  }
  const bear = (a, b) => (Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI + 360) % 360;
  const verts = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){
    const a = verts[verts.length - 1], b = pts[i], c = pts[i + 1];
    if (Math.abs(angleDiff(bear(b, c), bear(a, b))) > 25) verts.push(b);
  }
  verts.push(pts[pts.length - 1]);
  const turns = [];
  for (let i = 1; i < verts.length - 1; i++){
    const a = verts[i-1], b = verts[i], c = verts[i+1];
    const v1 = {x: b.x - a.x, y: b.y - a.y}, v2 = {x: c.x - b.x, y: c.y - b.y};
    const cross = v1.x * v2.y - v1.y * v2.x;           // y w dół: cross>0 = w prawo
    const dot = v1.x * v2.x + v1.y * v2.y;
    const ang = Math.atan2(Math.abs(cross), dot) * 180 / Math.PI;
    if (ang > 30) turns.push({d: b.d, dir: cross > 0 ? 'prawo' : 'lewo'});
  }
  const g = {units: d, verts, turns};
  geomCache.set(key, g);
  return g;
}
function bearingAt(st, distM){ // kierunek marszu w danym punkcie kroku
  const g = stepGeom(st); if (!g || g.units === 0) return null;
  const du = st.len > 0 ? Math.min(distM / st.len, 1) * g.units : 0;
  for (let i = 1; i < g.verts.length; i++){
    if (du <= g.verts[i].d + 1e-6 || i === g.verts.length - 1){
      const a = g.verts[i-1], b = g.verts[i];
      return (Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI + 360) % 360;
    }
  }
  return null;
}
function nextTurn(st, distM){ // najbliższy zakręt przed nami (w metrach)
  const g = stepGeom(st); if (!g || g.units === 0 || !st.len) return null;
  const du = (distM / st.len) * g.units;
  for (const t of g.turns){
    if (t.d > du + 0.5) return {dir: t.dir, m: (t.d - du) * (st.len / g.units)};
  }
  return null;
}
function junctionTurn(stA, stB){ // zakręt na styku dwóch kroków (to samo piętro)
  if (!stA || !stB || stA.floor !== stB.floor) return null;
  const b1 = bearingAt(stA, stA.len), b2 = bearingAt(stB, 0);
  if (b1 === null || b2 === null) return null;
  const d = angleDiff(b2, b1);
  if (d > 35) return 'prawo';
  if (d < -35) return 'lewo';
  return null;
}

/* ====================== kompas ====================== */
const compass = {
  raw: null, offset: LS.get('compassOffset', null), active: false, handler: null,
  async start(){ // wołane z gestu użytkownika (iOS wymaga zgody)
    if (compass.handler) return true;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      try {
        const st = await DeviceOrientationEvent.requestPermission();
        if (st !== 'granted') return false;
      } catch(e){ return false; }
    }
    compass.handler = (e) => {
      let h = null;
      if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
        h = e.webkitCompassHeading;                    // iOS Safari
      } else if (e.absolute && typeof e.alpha === 'number'){
        h = (360 - e.alpha) % 360;                     // Android (absolute)
      }
      if (h !== null){ compass.raw = h; compass.active = true; onHeading(); }
    };
    window.addEventListener('deviceorientationabsolute', compass.handler);
    window.addEventListener('deviceorientation', compass.handler);
    return true;
  },
  mapHeading(){ // kierunek patrzenia w stopniach mapy (po kalibracji)
    if (compass.raw === null || compass.offset === null) return null;
    return (compass.raw + compass.offset + 360) % 360;
  },
  calibrate(){ // użytkownik stoi przodem w kierunku marszu bieżącego odcinka
    const st = cur();
    if (!st || compass.raw === null) return false;
    const b = bearingAt(st, state.dist);
    if (b === null) return false;
    compass.offset = (b - compass.raw + 360) % 360;
    LS.set('compassOffset', compass.offset);
    return true;
  }
};
let lastHeadTs = 0;
function onHeading(){
  const now = performance.now();
  if (now - lastHeadTs < 100) return;   // ~10 Hz wystarczy
  lastHeadTs = now;
  updateInstruction();
  updateHeadingDot();
  updateMapRotation();
  updateCompassStatus();
}
function updateCompassStatus(){
  const el = $('compassStatus'); if (!el) return;
  if (!compass.active || compass.raw === null){ el.textContent = 'Kompas: nieaktywny (uruchamia się ze startem krokomierza)'; return; }
  const mh = compass.mapHeading();
  el.textContent = mh === null
    ? `Kompas: ${compass.raw.toFixed(0)}° — nieskalibrowany, użyj przycisku powyżej`
    : `Kompas: ${compass.raw.toFixed(0)}° · kierunek na mapie: ${mh.toFixed(0)}°`;
}

/* ====================== rysowanie ====================== */
const $ = id => document.getElementById(id);
function showFloor(f){
  state.floor = f;
  FLOORS.forEach(x => { $('f_'+x).style.display = (x===f?'':'none'); });
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.f===f));
}
function zoneEl(floor, code){
  return document.getElementById(`z_${floor}_${code==='Z02'?'Z01':code}`);
}
function clearHighlights(){
  document.querySelectorAll('svg .route path.on').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('svg .zone.mark').forEach(z => z.classList.remove('mark'));
  document.querySelectorAll('svg .walker').forEach(w => w.style.display='none');
}
function cur(){ return state.route[state.idx] || null; }

function render(){
  clearHighlights();
  const st = cur();
  const total = state.route.reduce((s,x)=>s+x.len, 0);
  if (!st){
    $('steptext').textContent = 'Wybierz start i cel, aby wyznaczyć trasę.';
    $('stepmeta').textContent = '';
    $('stepbar').style.width = '0';
  } else {
    showFloor(st.floor);
    st.overlays.forEach(id => { const p=$(id); if(p) p.classList.add('on'); });
    st.marks.forEach(c => { const z=zoneEl(st.floor,c); if(z) z.classList.add('mark'); });
    $('steptext').textContent = `${state.idx+1}. ${st.text}`;
    const frac = st.len>0 ? Math.min(state.dist/st.len,1) : 0;
    $('stepbar').style.width = (frac*100).toFixed(1)+'%';
    $('stepmeta').textContent =
      `Krok ${state.idx+1}/${state.route.length} · ${state.dist.toFixed(0)} m z ~${st.len} m` +
      ` · cała trasa ~${total} m`;
    updateDot();
  }
  $('btnPrev').disabled = !st || state.idx===0;
  $('btnNext').disabled = !st || state.idx>=state.route.length-1;
  const cad = state.pedoOn ? pedo.cadence() : null;
  const tempo = cad ? ` · tempo ${cad} kr/min (${(cad*state.stepLen*0.06).toFixed(1)} km/h)` : '';
  $('sensline').textContent = state.pedoOn
    ? `Krokomierz aktywny · kroki: ${state.stepsTaken} · krok = ${state.stepLen.toFixed(2)} m${tempo}`
    : `Krokomierz zatrzymany · kroki: ${state.stepsTaken}`;
  updateInstruction();
  updateCompassStatus();
  survey.status();
}
function updateDot(){
  const st = cur(); if(!st) return;
  const pathId = st.overlays[0]; if(!pathId) return;
  const path = $(pathId); if(!path || !path.getTotalLength) return;
  const L = path.getTotalLength();
  const frac = st.len>0 ? Math.min(state.dist/st.len, 1) : 0;
  const pos = st.rev ? (1-frac)*L : frac*L;
  const pt = path.getPointAtLength(pos);
  const dot = $('walker_'+st.floor);
  if (dot){ dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.display='block'; }
  updateHeadingDot();
  updateMapRotation();
}
function updateHeadingDot(){
  const st = cur();
  FLOORS.forEach(f => { const t=$('head_'+f); if(t) t.style.display='none'; });
  if (!st) return;
  const mh = compass.mapHeading();
  const tri = $('head_'+st.floor), dot = $('walker_'+st.floor);
  if (mh===null || !tri || !dot || dot.style.display==='none') return;
  const cx = parseFloat(dot.getAttribute('cx')||'0'), cy = parseFloat(dot.getAttribute('cy')||'0');
  tri.setAttribute('transform', `translate(${cx} ${cy}) rotate(${mh})`);
  tri.style.display='block';
}
function updateMapRotation(){
  const mh = compass.mapHeading();
  FLOORS.forEach(f => {
    const svg = $('f_'+f);
    if (!state.rotateMap || mh===null || f!==state.floor){ svg.style.transform='none'; return; }
    const dot = $('walker_'+f);
    let ox = 50, oy = 57;
    if (dot && dot.style.display!=='none'){
      ox = parseFloat(dot.getAttribute('cx')||'50');
      oy = parseFloat(dot.getAttribute('cy')||'57');
    }
    svg.style.transformOrigin = `${ox}% ${(oy/114*100)}%`;
    svg.style.transform = `rotate(${-mh}deg)`;
  });
}
function shortHint(nxt){
  if (!nxt) return 'cel';
  if (nxt.marks.includes('Z01')) return 'schody';
  if (nxt.wingPick) return 'główny korytarz (zaznacz kierunek do pokoju 136)';
  const jt = junctionTurn(cur(), nxt);
  if (jt) return `skręt w ${jt==='lewo'?'lewo':'prawo'}`;
  return 'prosto';
}
function updateInstruction(){
  const st = cur();
  const arrow = $('instrArrow'), txt = $('instrText');
  if (!st){ arrow.style.transform='none'; arrow.textContent='⬆'; txt.textContent='Wybierz trasę i ruszaj.'; return; }
  const t = nextTurn(st, state.dist);
  let icon = '⬆', msg;
  if (t){
    icon = t.dir==='lewo' ? '⬅' : '➡';
    msg = t.m < 3 ? `Skręć teraz w ${t.dir}` : `Za ok. ${Math.round(t.m)} m skręć w ${t.dir}`;
  } else {
    const rest = Math.max(0, (st.len||0) - state.dist);
    const nxt = state.route[state.idx+1];
    if (!nxt && rest < 3){ icon='🎯'; msg='Jesteś u celu'; }
    else if (!nxt) msg = `Prosto jeszcze ok. ${Math.round(rest)} m — cel przed Tobą`;
    else {
      const hint = shortHint(nxt);
      const jt = junctionTurn(st, nxt);
      if (jt) icon = jt==='lewo' ? '⬅' : '➡';
      msg = `Prosto ok. ${Math.round(rest)} m, potem: ${hint}`;
    }
  }
  const mh = compass.mapHeading(), b = bearingAt(st, state.dist);
  if (mh!==null && b!==null){
    // strzałka pokazuje, w którą stronę masz iść względem tego, gdzie patrzysz
    arrow.textContent = '⬆';
    arrow.style.transform = `rotate(${angleDiff(b, mh)}deg)`;
    const off = Math.abs(angleDiff(b, mh));
    if (off > 130) msg = 'Zawróć! ' + msg;
    else if (off > 60) msg = `Obróć się w ${angleDiff(b,mh)>0?'prawo':'lewo'}. ` + msg;
  } else {
    arrow.style.transform='none';
    arrow.textContent = icon;
  }
  txt.textContent = msg;
}

/* ====================== trasa / UI ====================== */
function rebuildRoute(keepPos=false){
  const a = $('selStart').value, b = $('selCel').value;
  state.route = buildRoute(a,b);
  if (!keepPos){ state.idx = 0; state.dist = 0; state.segSteps = 0; }
  state.idx = Math.min(state.idx, Math.max(0, state.route.length-1));
  LS.set('lastRoute', {start:a, cel:b});
  render();
}
function gotoStep(i){
  if (i<0 || i>=state.route.length) return;
  state.idx = i; state.dist = 0; state.segSteps = 0; render();
}
function advance(meters){
  const st = cur(); if(!st) { render(); return; }
  state.dist += meters;
  if (state.dist < 0){                                  // marsz w tył — cofnij
    if (state.idx > 0){
      state.idx--;
      const prev = cur();
      state.dist = Math.max(0, (prev.len||0) + state.dist);
    } else state.dist = 0;
  } else if (st.len>0 && state.dist >= st.len && state.idx < state.route.length-1){
    const rest = state.dist - st.len;
    state.idx++; state.dist = Math.max(0, rest);
  }
  render();
}

/* ====================== krokomierz ====================== */
const pedo = {
  g: {x:0,y:0,z:0}, last: 0, handler: null, stepTimes: [],
  cadence(){ // kroki na minutę z ostatnich 15 s
    const now = performance.now();
    const recent = pedo.stepTimes.filter(t => now - t < 15000);
    if (recent.length < 3) return null;
    const spanMin = (now - recent[0]) / 60000;
    if (spanMin <= 0) return null;
    const c = Math.round(recent.length / spanMin);
    return (c > 0 && c <= 240) ? c : null;             // poza zakresem = szum
  },
  forward(){ // krok zgodny z trasą: postęp + nauka długości kroku
    state.segSteps++;
    const prevIdx = state.idx, seg = cur();
    advance(state.stepLen);
    if (state.idx > prevIdx){                           // domknięty odcinek
      walklog.learn(seg.len || 0, state.segSteps);
      state.segSteps = 0;
    }
  },
  onStep(){
    state.stepsTaken++;
    pedo.stepTimes.push(performance.now());
    if (pedo.stepTimes.length > 40) pedo.stepTimes.shift();
    const st = cur(), mh = compass.mapHeading();
    if (st && mh !== null){
      const b = bearingAt(st, state.dist);
      if (b !== null){
        const off = Math.abs(angleDiff(mh, b));
        if (off <= 75) pedo.forward();                  // idziesz zgodnie z trasą
        else if (off >= 105){                           // idziesz w przeciwną stronę
          state.segSteps = Math.max(0, state.segSteps - 1);
          advance(-state.stepLen);
        }
        else render();                                  // bokiem — bez postępu
        return;
      }
    }
    pedo.forward();                                     // brak kompasu: jak dotąd
  },
  onMotion(e){
    const a = e.accelerationIncludingGravity; if(!a || a.x===null) return;
    const g = pedo.g, AL = 0.9;                 // filtr LP grawitacji
    g.x = AL*g.x + (1-AL)*a.x;
    g.y = AL*g.y + (1-AL)*a.y;
    g.z = AL*g.z + (1-AL)*a.z;
    const lx=a.x-g.x, ly=a.y-g.y, lz=a.z-g.z;
    const mag = Math.sqrt(lx*lx+ly*ly+lz*lz);
    const now = performance.now();
    if (mag > 1.4 && now - pedo.last > 320){    // próg 1,4 m/s², refrakcja 320 ms
      pedo.last = now; pedo.onStep();
    }
  },
  async start(){
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function'){
      const st = await DeviceMotionEvent.requestPermission();  // iOS: HTTPS + gest
      if (st !== 'granted'){ $('sensline').textContent = 'Brak zgody na czujniki ruchu.'; return false; }
    }
    pedo.handler = pedo.onMotion.bind(pedo);
    window.addEventListener('devicemotion', pedo.handler);
    return true;
  },
  stop(){
    if (pedo.handler){ window.removeEventListener('devicemotion', pedo.handler); pedo.handler=null; }
  }
};

/* ====================== Wake Lock (z fallbackiem) ====================== */
const wake = {
  lock: null,
  async on(){
    if (!('wakeLock' in navigator)){
      $('wakebadge').textContent = 'Brak Wake Lock — ekran może zgasnąć; wydłuż autoblokadę.';
      return;
    }
    try {
      wake.lock = await navigator.wakeLock.request('screen');
      $('wakebadge').textContent = 'Ekran nie zgaśnie 🔆';
      wake.lock.addEventListener('release', () => {
        wake.lock = null;
        if (state.pedoOn) $('wakebadge').textContent = 'Wake Lock zwolniony';
      });
    } catch(e){
      $('wakebadge').textContent = 'Wake Lock niedostępny: ' + e.name;
    }
  },
  async off(){
    if (wake.lock){ try{ await wake.lock.release(); }catch(e){} wake.lock=null; }
    $('wakebadge').textContent = '';
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='visible' && state.pedoOn && !wake.lock) wake.on();
});

/* ====================== init UI ====================== */
function initSelects(){
  const names = Object.keys(POIS);
  for (const sel of [$('selStart'), $('selCel')]){
    sel.innerHTML = names.map(n=>`<option>${n}</option>`).join('');
    sel.addEventListener('change', ()=>rebuildRoute(false));
  }
  const last = LS.get('lastRoute', {start:'Recepcja', cel:'Pokój 136'});
  $('selStart').value = names.includes(last.start) ? last.start : 'Recepcja';
  $('selCel').value   = names.includes(last.cel) && last.cel !== $('selStart').value
                        ? last.cel : 'Pokój 136';
}
function initWings(){
  const row = $('wingrow');
  row.innerHTML = '<span style="font-size:.72rem;color:var(--muted);flex-basis:100%">W którą stronę do pokoju 136, stojąc na górze schodów (1. piętro)?</span>';
  for (const [key,w] of Object.entries(WINGS)){
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = w.label;
    b.style.borderColor = w.color;
    b.dataset.w = key;
    b.addEventListener('click', ()=>{
      state.wing = (state.wing===key ? null : key);   // drugi klik odpina
      LS.set('wing136', state.wing);
      updateWingButtons();
      rebuildRoute(true);
    });
    row.appendChild(b);
  }
  updateWingButtons();
}
function updateWingButtons(){
  document.querySelectorAll('#wingrow .btn').forEach(b =>
    b.classList.toggle('sel', b.dataset.w===state.wing));
}
$('btnPrev').addEventListener('click', ()=>gotoStep(state.idx-1));
$('btnNext').addEventListener('click', ()=>gotoStep(state.idx+1));
async function setPedo(on){
  if (on && !state.pedoOn){
    const ok = await pedo.start();
    if (!ok) return false;
    await compass.start();          // ten sam gest użytkownika starcza dla obu zgód
    state.pedoOn = true;
    walklog.start();
    $('btnPedo').textContent = 'Stop krokomierza';
    $('btnPedo').classList.remove('acc'); $('btnPedo').classList.add('ok');
    wake.on();
  } else if (!on && state.pedoOn){
    pedo.stop(); state.pedoOn = false;
    walklog.stop();
    $('btnPedo').textContent = 'Start krokomierza';
    $('btnPedo').classList.add('acc'); $('btnPedo').classList.remove('ok');
    wake.off();
  }
  render();
  return true;
}
$('btnPedo').addEventListener('click', ()=>setPedo(!state.pedoOn));

/* ====================== tryb pomiaru trasy ====================== */
/* Nagrywa realny przebieg: kroki między zdarzeniami (zakręt, schody,
   punkt, cel) → metry wg nauczonej długości kroku. Eksport tych danych
   pozwala przebudować plany na prawdziwą geometrię hotelu. */
const survey = {
  active: false, name: '', lastSteps: 0, events: [], t0: null,
  saved: LS.get('surveys', []),
  async start(){
    const name = prompt('Co mierzysz? (skąd → dokąd)', 'Recepcja → Pokój 136');
    if (name === null) return;
    if (!state.pedoOn && !(await setPedo(true))) return;
    survey.active = true;
    survey.name = name || 'trasa';
    survey.t0 = new Date().toISOString();
    survey.events = [];
    survey.lastSteps = state.stepsTaken;
    $('surveyrow').classList.add('on');
    $('btnSurvey').textContent = '⏹ Przerwij pomiar';
    survey.status();
  },
  mark(type){
    if (!survey.active) return;
    let label = null;
    if (type === 'punkt') label = prompt('Co to za punkt? (np. drzwi ppoż., winda, recepcja)') || 'punkt';
    const steps = state.stepsTaken - survey.lastSteps;
    survey.events.push({type, label, steps, m: +(steps*state.stepLen).toFixed(1)});
    survey.lastSteps = state.stepsTaken;
    if (type === 'cel') survey.finish(true);
    else survey.status();
  },
  finish(completed){
    if (survey.active && (completed || survey.events.length)){
      survey.saved.push({name: survey.name, t0: survey.t0, t1: new Date().toISOString(),
                         stepLen: state.stepLen, done: !!completed, events: survey.events});
      if (survey.saved.length > 10) survey.saved.shift();
      LS.set('surveys', survey.saved);
    }
    survey.active = false;
    $('surveyrow').classList.remove('on');
    $('btnSurvey').textContent = '📏 Zmierz prawdziwą trasę (tryb pomiaru)';
    if (completed) $('sensline').textContent =
      `Pomiar „${survey.name}" zapisany (${survey.events.length} zdarzeń) — wyślij go przyciskiem 📤 w Ustawieniach.`;
  },
  status(){
    if (!survey.active) return;
    const sinceLast = state.stepsTaken - survey.lastSteps;
    $('surveyStatus').textContent =
      `Pomiar „${survey.name}" · zdarzeń: ${survey.events.length} · od ostatniego: ` +
      `${sinceLast} kroków (~${(sinceLast*state.stepLen).toFixed(0)} m). Idź i klikaj, co robisz.`;
  }
};
$('btnSurvey').addEventListener('click', ()=>{ survey.active ? survey.finish(false) : survey.start(); });
document.querySelectorAll('#surveyrow [data-ev]').forEach(b =>
  b.addEventListener('click', ()=>survey.mark(b.dataset.ev)));
$('btnCal').addEventListener('click', async ()=>{
  if (!compass.active) await compass.start();
  setTimeout(()=>{                 // daj kompasowi chwilę na pierwszy odczyt
    const ok = compass.calibrate();
    $('compassStatus').textContent = ok
      ? `Skalibrowano ✓ (offset ${compass.offset.toFixed(0)}°)`
      : 'Kalibracja nieudana — wyznacz trasę i sprawdź, czy kompas ma odczyt.';
    render();
  }, 350);
});
$('chkLearn').checked = state.autoLearn;
$('chkLearn').addEventListener('change', ()=>{
  state.autoLearn = $('chkLearn').checked;
  LS.set('autoLearn', state.autoLearn);
});
$('btnExport').addEventListener('click', async ()=>{
  $('exportStatus').textContent = await walklog.export();
});
$('chkRotate').checked = state.rotateMap;
$('chkRotate').addEventListener('change', ()=>{
  state.rotateMap = $('chkRotate').checked;
  LS.set('rotateMap', state.rotateMap);
  updateMapRotation();
});
$('inpStep').value = state.stepLen;
$('inpStep').addEventListener('change', ()=>{
  const v = parseFloat($('inpStep').value);
  if (v>=0.4 && v<=1.2){ state.stepLen = v; LS.set('stepLen', v); render(); }
});
document.querySelectorAll('#tabs button').forEach(b =>
  b.addEventListener('click', ()=>{ showFloor(b.dataset.f); }));

initSelects();
initWings();
rebuildRoute(false);
showFloor(cur() ? cur().floor : 'parter');

/* ====================== PWA ====================== */
if ('serviceWorker' in navigator &&
    (location.protocol==='https:' || location.hostname==='localhost')){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js'));
}
</script>
