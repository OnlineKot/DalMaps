<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DalMaps — placeholder</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 2rem 1.25rem;
         background: #1a1d23; color: #eee; text-align: center; }
  h1 { font-size: 1.4rem; }
  p  { color: #aab; line-height: 1.5; }
  button { font-size: 1.1rem; padding: .9rem 1.4rem; border: 0; border-radius: 12px;
           background: #c62828; color: #fff; }
  #out { margin-top: 1.5rem; font-variant-numeric: tabular-nums; font-size: 1.2rem; }
</style>
</head>
<body>
<h1>DalMaps — strona tymczasowa</h1>
<p>To placeholder do weryfikacji HTTPS na GitHub Pages.<br>
Docelowo tu trafi zawartość <code>dalmahoy-nawigator.html</code>.</p>
<button id="go">Test czujników (DeviceMotion)</button>
<div id="out">—</div>
<script>
// Minimalny test akceptacyjny: zgoda na czujniki na iOS wymaga HTTPS + gestu użytkownika.
document.getElementById('go').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const st = await DeviceMotionEvent.requestPermission();
      if (st !== 'granted') { out.textContent = 'Brak zgody: ' + st; return; }
    }
    let n = 0;
    window.addEventListener('devicemotion', e => {
      const a = e.accelerationIncludingGravity;
      if (a) out.textContent = `próbka #${++n}: ${a.x?.toFixed(2)}, ${a.y?.toFixed(2)}, ${a.z?.toFixed(2)} m/s²`;
    });
    out.textContent = 'Czujniki OK — porusz telefonem…';
  } catch (err) {
    out.textContent = 'Błąd: ' + err.message;
  }
});
</script>
</body>
</html>
